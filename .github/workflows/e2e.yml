name: E2E Tests

# Manually triggered — select environment before running.
# Runs against a deployed environment (dev or prod) via public FQDN + az CLI.
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to test"
        required: true
        type: choice
        options:
          - DEV
          - PROD

jobs:
  e2e:
    name: "E2E ${{ inputs.env }}"
    runs-on: ubuntu-latest

    # SP credentials looked up dynamically from org-level secrets using uppercase ENV.
    env:
      ARM_CLIENT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_ID_TERRAFORM', inputs.env)] }}
      ARM_CLIENT_SECRET:   ${{ secrets[format('SDLC_{0}_AZURE_CLIENT_SECRET_TERRAFORM', inputs.env)] }}
      ARM_TENANT_ID:       ${{ secrets[format('SDLC_{0}_AZURE_TENANT_ID_TERRAFORM', inputs.env)] }}
      ARM_SUBSCRIPTION_ID: ${{ secrets[format('SDLC_{0}_AZURE_SUBSCRIPTION_ID_TERRAFORM', inputs.env)] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase env
        run: echo "ENV_LOWER=$(echo '${{ inputs.env }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Azure Login
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # Fetch the public FQDN of the Container App to hit the deployed API
      - name: Get deployed API URL
        run: |
          FQDN=$(az containerapp show \
            --name "ca-sdlc-base-${{ env.ENV_LOWER }}" \
            --resource-group "rg-sdlc-base-${{ env.ENV_LOWER }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "BASE_URL=https://$FQDN" >> $GITHUB_ENV
          echo "ENV=${{ env.ENV_LOWER }}" >> $GITHUB_ENV
          echo "Testing against: https://$FQDN"

      # Warm up the Container App before tests — scale-to-zero means the first request
      # after idle waits ~30-60s for a new container to boot. Warming up here lets
      # pytest run against a hot instance instead of timing out on the first test.
      - name: Warm up Container App
        run: |
          echo "Warming up $BASE_URL/health..."
          for i in $(seq 1 36); do  # up to 3 minutes (36 × 5s)
            if curl -sf --max-time 15 "$BASE_URL/health" > /dev/null; then
              echo "API is ready (took ~$((i * 5))s)"
              exit 0
            fi
            echo "  attempt $i — not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: API did not become ready within 3 minutes"
          exit 1

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run e2e tests
        run: uv run pytest tests/ -v --tb=short
